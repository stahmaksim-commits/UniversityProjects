name: SplitwiseClone CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore SplitwiseClone/SplitwiseClone.Tests/SplitwiseClone.Tests.csproj

      - name: Build
        run: dotnet build SplitwiseClone/SplitwiseClone.Tests/SplitwiseClone.Tests.csproj --no-restore

      - name: Run unit tests
        run: dotnet test SplitwiseClone/SplitwiseClone.Tests/SplitwiseClone.Tests.csproj --no-build --verbosity normal
